model:
  name: "Urban Issues YOLOv8 Detector"
  version: "1.0"
  framework: "Ultralytics YOLOv8"
  task: "object-detection"
  input_size: 640
  inference:
    confidence_threshold: 0.25
    iou_threshold: 0.45
  num_classes: 10
  dataset: "Nagpur & Indian Urban Road Defect Dataset (Potholes, Asphalt Subsidence, Infrastructure Hazards)"
